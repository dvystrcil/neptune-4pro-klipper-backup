#####################################################################
# BTT EBB42 — Chamber Environment Controller
#####################################################################
# PA0 -> chamber circulation fan
# PA1 -> SSR trigger for chamber heater
# Temperature is read from the existing [temperature_sensor chamber]
# defined in temperature_sensors.cfg (wired to the SP_MMU) and
# consumed here via sensor_type: temperature_combined.

[mcu ebb42]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4900490008504D4D35383820-if00
restart_method: command

[temperature_sensor EBB42_mcu]
sensor_type: temperature_mcu
sensor_mcu: ebb42
min_temp: 0
max_temp: 100

#####################################################################
# Chamber Circulation Fan (PA0)
#####################################################################
[fan_generic chamber_fan]
pin: ebb42:PA0
cycle_time: 0.01
hardware_pwm: false

#####################################################################
# Chamber Heater — SSR on PA1
#####################################################################
# watermark (bang-bang) control is friendlier to SSRs than PWM.
[heater_generic chamber_heater]
heater_pin: ebb42:PA1
max_power: 1.0
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber
combination_method: mean
maximum_deviation: 999
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 80

[verify_heater chamber_heater]
max_error: 600
check_gain_time: 240
hysteresis: 10
heating_gain: 1
