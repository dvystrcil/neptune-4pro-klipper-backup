#####################################################################
# BTT EBB42 — Chamber Environment Controller
#####################################################################
# PA0 -> chamber circulation fan
# PA1 -> SSR trigger for chamber heater
# Temperature is read from the existing [temperature_sensor chamber]
# defined in temperature_sensors.cfg (wired to the SP_MMU) and
# consumed here via sensor_type: temperature_combined.

[mcu chamber]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4900490008504D4D35383820-if00
restart_method: command

[temperature_sensor chamber_mcu]
sensor_type: temperature_mcu
sensor_mcu: chamber
min_temp: 0
max_temp: 100

[temperature_sensor chamber_upper]
sensor_type: Generic 3950
sensor_pin: PICO_MMU: PA3
min_temp: 0
max_temp: 80
gcode_id: chamber_upper

[temperature_sensor chamber_lower]
sensor_type: Generic 3950
sensor_pin: chamber: PA3
min_temp: 0
max_temp: 80
gcode_id: chamber_lower

#####################################################################
# Chamber Circulation Fan (PA0)
#####################################################################
[fan_generic chamber_fan]
pin: chamber:PA0
cycle_time: 0.01
hardware_pwm: false

#####################################################################
# Chamber Heater — SSR on PA1
#####################################################################
# watermark (bang-bang) control is friendlier to SSRs than PWM.
[heater_generic chamber_heater]
heater_pin: chamber:PA1
max_power: 1.0
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_upper, temperature_sensor chamber_lower
combination_method: mean
maximum_deviation: 999
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 80

[verify_heater chamber_heater]
max_error: 600
check_gain_time: 240
hysteresis: 10
heating_gain: 1

#####################################################################
# M141 / M191 — Chamber heater control
#####################################################################
[gcode_macro M141]
gcode:
  {% set s = (params.S|float, 80)|min if params.S is defined else 0 %}
  SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s|int}
  {% if s == 0 %}
    # SET_FAN_SPEED FAN=chamber_fan SPEED=0 # let the fan run, no harm in this
    RESPOND PREFIX=chamber MSG="Chamber heater off."
  {% else %}
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
    RESPOND PREFIX=chamber MSG="Chamber target set to {s|int}c."
  {% endif %}

[gcode_macro M191]
gcode:
  {% set s = (params.S|float, 80)|min if params.S is defined else 0 %}
  {% if s == 0 %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    # SET_FAN_SPEED FAN=chamber_fan SPEED=0 # let the fan run, no harm in this
    RESPOND PREFIX=chamber MSG="Chamber heating cancelled."
  {% else %}
    RESPOND PREFIX=chamber MSG="Chamber heating to: {s|int}c"
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s|int}
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={s-1}
    RESPOND PREFIX=chamber MSG="... chamber at target temperature."
  {% endif %}


[gcode_macro PID_Tune_Chamber]
gcode:
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=100
  SET_HEATER_TEMPERATURE HEATER=heater_bed_outer TARGET=100
  G90              ; back to absolute
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z50 F6000
  M106 S255
  SET_FAN_SPEED FAN=Bentobox SPEED=1.0
  SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
  PID_CALIBRATE HEATER=chamber_heater TARGET=55
  SAVE_CONFIG